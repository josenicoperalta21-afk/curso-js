<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  </head>
  <body>
    <section class="section">
      <div class="container">
        <div class="columns is-centered">
          <div class="column is-half">
            <form action="" autocomplete="off" class="box" id="form">
              <div class="field">
                <label class="label" for="apellidos">Apellidos</label>
                <input
                  type="text"
                  class="input"
                  id="apellidos"
                  minlength="3"
                  required
                />
              </div>
              <div class="field">
                <label class="label" for="nombres">Nombres</label>
                <input type="text" class="input" id="nombres" minlength="3" />
              </div>
              <div class="field">
                <label class="label" for="fechanac">Fecha nacimiento</label>
                <input
                  type="date"
                  id="fechanac"
                  class="input"
                  min="1999-12-31"
                  max="2026-10-20"
                  required
                />
              </div>
              <div class="field">
                <label class="label" for="email">Correo electrónico</label>
                <input type="email" class="input" id="email" required />
              </div>
              <div class="field">
                <label class="label" for="experiencia">Experiencia:</label>
                <input
                  type="number"
                  class="input"
                  min="0"
                  max="30"
                  value="1"
                  id="experiencia"
                  required
                />
              </div>
              <div class="field">
                <label for="cargo" class="label">Cargo</label>
                <div class="select is-fullwidth">
                  <select class="select" name="cargo" id="cargo">
                    <option value=""></option>
                    <option value="1">Analista</option>
                    <option value="2">Programador</option>
                    <option value="3">Jefe</option>
                  </select>
                </div>
              </div>
              <div class="field is-grouped">
                <div class="control">
                  <button class="button is-link" type="submit">Enviar</button>
                </div>
                <div class="control">
                  <button class="button is-link is-light" type="reset">
                    Reiniciar
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
    <script>
      //Vamos a detener el evento submit (envio)
      //El evento submit esta asociado al formulario y No al boton
      const formulario = document.getElementById("form");
      //Gestion de eventos
      formulario.addEventListener("submit", function (event) {
        //Freno para cualquier evento...
        event.preventDefault();
        if (confirm("¿Esta seguro de proceder?")) {
          alert("Guardando correctamente...");
        }
      });
    </script>
  </body>
</html>
